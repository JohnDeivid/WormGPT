<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Phishing Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); width: 350px; text-align: center; }
        h2 { margin-bottom: 20px; color: #1c1e21; }
        input[type="text"], input[type="password"] { width: calc(100% - 20px); padding: 12px 10px; margin-bottom: 15px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; }
        input[type="submit"] { width: 100%; padding: 12px; background-color: #1877f2; color: white; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; }
        input[type="submit"]:hover { background-color: #166fe5; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Correo electrónico o número de teléfono" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <input type="submit" value="Iniciar Sesión">
        </form>
        <p class="error" style="display:none;">Usuario o contraseña incorrectos. Inténtalo de nuevo.</p>
    </div>
</body>
</html>

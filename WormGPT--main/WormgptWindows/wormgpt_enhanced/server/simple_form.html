<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario sencillo</title>
    <style>
        body{font-family:sans-serif;margin:2rem;background:#f5f5f5;}
        form{max-width:400px;margin:auto;background:white;padding:1.5rem;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
        label{display:block;margin-top:1rem;font-weight:bold}
        input[type=text],input[type=email],textarea{width:100%;padding:.5rem;margin-top:.5rem;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
        input[type=submit]{margin-top:1.5rem;padding:.75rem 1.5rem;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer}
        input[type=submit]:hover{background:#0056b3}
    </style>
</head>
<body>
    <form action="/submit" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
